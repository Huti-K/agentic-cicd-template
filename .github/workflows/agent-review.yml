name: Codex independent review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      metadata: ${{ steps.pr.outputs.metadata }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: pr
        with:
          script: |
            const number = Number(context.payload.pull_request?.number ?? context.payload.inputs?.pr_number);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.draft || pr.state !== 'open' || pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('Only open, same-repository PRs may use the API secret.');
            core.setOutput('number', String(number));
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', pr.base.sha);
            core.setOutput('metadata', JSON.stringify({ title: pr.title, body: pr.body, head: pr.head.sha, base: pr.base.sha }));
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.head.sha, state: 'pending', context: 'AI review', description: 'Independent Codex review is running' });
  review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact PR diff without checking out or executing candidate code
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.number }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head }}
          PR_JSON: ${{ needs.prepare.outputs.metadata }}
        run: |
          git fetch origin "pull/$PR_NUMBER/head:refs/remotes/origin/review-head"
          test "$(git rev-parse refs/remotes/origin/review-head)" = "$EXPECTED_HEAD"
          mkdir -p .agent-output
          git diff HEAD...refs/remotes/origin/review-head > .agent-output/change.diff
          test "$(wc -c < .agent-output/change.diff)" -le 500000
          node -e "require('fs').writeFileSync('.agent-output/pr.json', process.env.PR_JSON)"
      - name: Check credential configuration
        env:
          KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$KEY_CONFIGURED" != true ]; then
            echo '::error::OPENAI_API_KEY is missing.'
            exit 1
          fi
      - name: Independent Codex review
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/review.md
          codex-args: '["--output-schema", ".github/codex/review.schema.json"]'
          sandbox: read-only
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL }}
          effort: medium
          codex-version: ${{ vars.CODEX_VERSION }}
          allow-bots: true
  report:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, review]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.review.outputs.result }}
          REVIEW_JOB: ${{ needs.review.result }}
          PR_NUMBER: ${{ needs.prepare.outputs.number }}
          REVIEWED_HEAD: ${{ needs.prepare.outputs.head }}
          REVIEWED_BASE: ${{ needs.prepare.outputs.base }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const head = process.env.REVIEWED_HEAD;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.sha !== head) {
              core.notice('PR closed or its head changed; discarding stale review.');
              return;
            }
            if (pr.base.sha !== process.env.REVIEWED_BASE) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: head, state: 'error', context: 'AI review',
                target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                description: 'Base changed during review; rerun independent review for this PR'
              });
              core.setFailed('The base branch advanced during review. Rerun Codex independent review for this PR against the current base.');
              return;
            }
            const safeText = (value) => String(value).replace(/\s+/g, ' ').trim()
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/([\\\x60*_{}\[\]()#+.!|~>-])/g, '\\$1').replace(/@/g, '@\u200b');
            const validText = (text, max) => typeof text === 'string' && text.trim().length > 0 && text.length <= max;
            const validPath = (path) => validText(path, 260) && !/[\x00-\x1f\\]/.test(path)
              && path.split('/').every(part => part && part !== '.' && part !== '..');
            const repositoryUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo;
            const url = repositoryUrl + '/actions/runs/' + context.runId;
            let state = 'error';
            let body = '### ⛔ REVIEW INCOMPLETE\n\nCodex did not complete the review. Inspect the run and retry; this is not an approval.';
            if (process.env.REVIEW_JOB === 'success') {
              try {
                const result = JSON.parse(process.env.RESULT);
                if (!result || !['pass', 'needs_changes'].includes(result.verdict) || !validText(result.summary, 1200)
                  || !Array.isArray(result.findings) || result.findings.length > 10
                  || result.findings.some(f => !f || !['P1', 'P2'].includes(f.severity) || !validPath(f.path)
                    || !Number.isSafeInteger(f.line) || f.line < 1 || !validText(f.description, 1200))) throw new Error('Invalid review format');
                if ((result.verdict === 'pass') !== (result.findings.length === 0)) throw new Error('Verdict and findings disagree');
                const passed = result.verdict === 'pass';
                state = passed ? 'success' : 'failure';
                const findings = result.findings.map(f => {
                  const path = f.path.split('/').map(part => encodeURIComponent(part).replace(/[!'()*]/g, char => '%' + char.charCodeAt(0).toString(16))).join('/');
                  const source = repositoryUrl + '/blob/' + head + '/' + path + '#L' + f.line;
                  return '- **' + f.severity + '** · [' + safeText(f.path) + ':' + f.line + '](' + source + ') — ' + safeText(f.description);
                }).join('\n') || '_No actionable findings._';
                body = [
                  '### ' + (passed ? '✅ PASS' : '⚠️ CHANGES REQUESTED'), '',
                  safeText(result.summary), '', '### Findings', '', findings, '',
                  '_The reviewer inspected source without executing candidate code. CI runs tests separately._'
                ].join('\n');
              } catch {
                body = '### ⛔ INVALID REVIEW\n\nThe result failed validation. Inspect the run and retry; this is not an approval.';
              }
            }
            const fullBody = [
              '## Independent Codex review', '', body, '',
              '**Reviewed commit:** <code>' + head + '</code>', '[Review run](' + url + ')', '',
              'AI feedback supports the human merge decision.'
            ].join('\n');
            await github.rest.pulls.createReview({ ...context.repo, pull_number: number, commit_id: head, event: 'COMMENT', body: fullBody });
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: head, state, context: 'AI review', target_url: url,
              description: state === 'success' ? 'No actionable defects reported' : 'Review needs attention; inspect the report'
            });
            await core.summary.addRaw(fullBody).write();
            if (state !== 'success') core.setFailed('AI review did not pass.');
