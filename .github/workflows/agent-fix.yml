name: Codex issue fix
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open bug-report issue number
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fix-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      number: ${{ steps.issue.outputs.number }}
      base: ${{ steps.issue.outputs.base }}
      sha: ${{ steps.issue.outputs.sha }}
      issue: ${{ steps.issue.outputs.issue }}
      title: ${{ steps.issue.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: issue
        with:
          script: |
            await require('./scripts/workflow/issue.cjs').gate({ github, context, core });
  implement:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Capture the authorized issue snapshot
        env:
          ISSUE_JSON: ${{ needs.gate.outputs.issue }}
        run: |
          mkdir -p .agent-output
          node -e "require('fs').writeFileSync('.agent-output/issue.json', process.env.ISSUE_JSON)"
      - name: Check credential configuration
        env:
          KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$KEY_CONFIGURED" != true ]; then
            echo '::error::Add OPENAI_API_KEY in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Implement with Codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/implement.md
          output-file: .agent-output/summary.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL }}
          effort: medium
          codex-version: ${{ vars.CODEX_VERSION }}
      # Only collect an untrusted artifact after Codex; no write credential in this job.
      - name: Collect proposed patch
        run: |
          git add --intent-to-add demo tests/demo
          git diff --binary HEAD -- demo tests/demo > .agent-output/fix.patch
          test -s .agent-output/fix.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposed-fix
          path: .agent-output/fix.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  verify-patch:
    needs: [gate, implement]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposed-fix
          path: .agent-output
      - name: Validate and test patch without secrets
        run: |
          git apply --index .agent-output/fix.patch
          node scripts/workflow/validate-patch.mjs
          node scripts/workflow/verify-regression.mjs
          npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-evidence
          path: .agent-output/regression.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [gate, verify-patch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposed-fix
          path: .agent-output
      - name: Apply only the verified demo patch
        run: |
          git apply --index .agent-output/fix.patch
          node scripts/workflow/validate-patch.mjs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          token: ${{ github.token }}
          branch: agent/issue-${{ needs.gate.outputs.number }}
          base: ${{ needs.gate.outputs.base }}
          add-paths: |
            demo/
            tests/demo/
          commit-message: 'fix: address issue #${{ needs.gate.outputs.number }}'
          title: 'fix: ${{ needs.gate.outputs.title }}'
          body: |
            Closes #${{ needs.gate.outputs.number }}

            Codex generated this focused demo patch from the maintainer-authorized issue.
            A separate runner verified that the regression test fails with an assertion on the original code,
            then validated the patch and passed `npm run check` on the fix.
            Download **regression-evidence** from the implementation run for the recorded result.

            CI and an independent Codex review are explicitly dispatched below. Inspect both before merging.
            [Implementation and test evidence](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      - name: Start CI and independent review for the bot-created PR
        if: steps.pr.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_BRANCH: agent/issue-${{ needs.gate.outputs.number }}
          BASE_BRANCH: ${{ needs.gate.outputs.base }}
        with:
          script: |
            // GITHUB_TOKEN-created PRs do not automatically trigger other workflows.
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'ci.yml', ref: process.env.PR_BRANCH });
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'agent-review.yml', ref: process.env.BASE_BRANCH, inputs: { pr_number: process.env.PR_NUMBER } });

  summary:
    if: always()
    needs: [gate, implement, verify-patch, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Summarize the agent handoffs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const results = JSON.parse(process.env.RESULTS);
          const rows = Object.entries(results).map(([job, value]) => '| ' + job + ' | ' + value.result + ' |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Agent delivery evidence', '', '| Stage | Result |', '| --- | --- |', ...rows, '',
            'One authorized issue → one bounded implementation attempt → independent regression proof → PR.',
            'A failed gate stops publication. Inspect the failed job before retrying; no automatic repair loop is started.', ''
          ].join('\n'));
          NODE
