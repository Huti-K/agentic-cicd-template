name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit:
    name: Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  automation:
    name: Workflow validation and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm run tools:install
      - run: npm run lint:workflows
      - run: npm run scan:secrets
  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        with:
          path: dist
  # Keep this stable name: existing branch protection requires "verify".
  verify:
    if: always()
    needs: [unit, automation, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check and summarize the evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const results = JSON.parse(process.env.RESULTS);
          const rows = Object.entries(results).map(([job, value]) => '| ' + job + ' | ' + value.result + ' |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Delivery checks', '', '| Check | Result |', '| --- | --- |', ...rows, '',
            'Download **browser-report** for screenshots and failure traces, or **site-preview** to inspect the exact build.',
            'AI review runs independently and remains a separate required check.', ''
          ].join('\n'));
          if (Object.values(results).some(value => value.result !== 'success')) process.exit(1);
          NODE
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: [verify, browser]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Deploy the browser-tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the deployed commit and public assets
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs
      - name: Record deployment evidence
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          printf '## Deployment verified\n\nSite: %s\n\nCommit: %s\n' "$DEPLOYMENT_URL" "$DEPLOYED_SHA" >> "$GITHUB_STEP_SUMMARY"
